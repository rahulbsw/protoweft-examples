# The Protoweft version every example builds against (through protoweft-bom).
# Override on the command line: ./gradlew build -PprotoweftVersion=0.1.0
protoweftVersion=0.1.0-SNAPSHOT

# Versions of the third-party libraries the examples use directly (Protoweft's own pins).
mcpSdkVersion=2.1.0
langchain4jVersion=1.23.0
springBootVersion=4.1.2
springAiVersion=2.0.2
slf4jVersion=2.0.17
junitVersion=5.11.4
assertjVersion=3.27.3
jsoupVersion=1.24.1

org.gradle.caching=true
org.gradle.parallel=true
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m
