name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Protoweft snapshots change with every push to protoweft's main: build daily against the latest.
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Build and test every example
        run: ./gradlew build --console=plain
      - name: Check that the tour's replay recordings are current
        # The build re-records them (RecordReplayTest); a difference means the protocols' traffic changed.
        run: |
          git diff --stat --exit-code -- tour/frontend/public/replay || {
            echo "::error::The tour's replay recordings changed. Run ./gradlew :tour:test and commit tour/frontend/public/replay."
            exit 1
          }
      - name: Run the MCP client example
        run: ./gradlew :mcp-client-example:run --console=plain
      - name: Run the plain-Java gateway example
        run: ./gradlew :plain-java-gateway:run --console=plain
      - name: Run the LangChain4j example (without a key it lists its tools)
        run: ./gradlew :langchain4j-example:run --console=plain
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports-jdk${{ matrix.java }}
          path: '**/build/reports/tests/'

  web-pages:
    name: Build the web pages (AG-UI example, tour)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
      - name: AG-UI example page
        working-directory: agui-web/frontend
        run: npm ci --ignore-scripts && npm run build
      - name: Tour page (live and GitHub Pages builds)
        working-directory: tour/frontend
        run: npm ci --ignore-scripts && npm run build && npm run build:pages
